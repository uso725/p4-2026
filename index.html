<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #e8dff5;
        }

        .profile-image {
            width: 180px;
            height: 180px;
            margin-bottom: 18px;
            object-fit: cover;
            border: 2px solid #6a4c93;
            border-radius: 50%;
        }

        .box {
            width: 420px;
            max-width: 80vw;
            padding: 32px 28px;
            background-color: #f5effa;
            border: 2px solid #6a4c93;
            border-radius: 12px;
            text-align: center;
            box-sizing: border-box;
        }

        .player-container {
            margin-top: 20px;
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: center;
        }

        h2 {
            margin: 0;
            font-size: 2rem;
            color: #4a2c6d;
        }

        blockquote {
            position: absolute;
            top: 50%;
            left: 5vw;
            max-width: 320px;
            margin: 0;
            padding-left: 0;
            color: #4a2c6d;
            font-size: 1.25rem;
            font-style: italic;
            line-height: 1.5;
            transform: translateY(-50%);
        }

        @media (max-width: 800px) {
            blockquote {
                position: static;
                max-width: 80vw;
                margin: 0 0 24px;
                transform: none;
            }
        }
    </style>
</head>
<body> 
    <blockquote>
        We'll be hand in hand down in the park<br>
        With a squeeze and a sigh and that twinkle in your eye<br>
        And all the sunshine banishes the dark
    </blockquote>
    <img class="profile-image" src="809b6cdedf9a489eba6f8a3d4907f8a1.jpg" alt="Purple flowers">
    <div class="box">
        <h2>Kelson he/him</h2>
        <pre>      \    /\
       )  ( ')
      (  /  )
       \(__)|</pre>
    </div>
    <div class="player-container">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/4TwaeQT1YTeBUBRB8NeSCo?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>
</body>
</html>
