<!doctype html>
<html>
<head>
  <title>Missing Puppy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 class="display-4 text-center text-primary">Missing Puppy</h1>
    <p>My puppy is missing. Please help me find them.</p>

    <p class="border p-2">If you see my puppy, please contact me.</p>

    <a class="btn btn-primary" href="https://www.google.com">Find a shelter</a>

    <h2 class="mt-3">Send me a message</h2>
    <label>Your email:</label>
    <input class="form-control">
    <button class="btn btn-secondary mt-2" disabled>Send</button>
  </div>
</body>
</html>
